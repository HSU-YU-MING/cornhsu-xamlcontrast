name: 'XamlContrast WCAG audit'
description: 'Static WCAG contrast audit for XAML source: scans the whole project, fails the PR when text falls below AA, annotates failing lines.'
author: 'Cornhsu'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  root:
    description: 'Root directory of the project to scan (the one containing your XAML)'
    required: true
  working-directory:
    description: 'Directory to run in (`root` is resolved relative to it)'
    required: false
    default: '.'
  version:
    description: 'Cornhsu.XamlContrast tool version (omit for latest; pinning is recommended while 0.x)'
    required: false
    default: ''
  fail-on:
    description: 'fail (default), or warn to also gate on near-threshold pairs (i.e. require a clean AA pass)'
    required: false
    default: 'fail'
  baseline:
    description: 'Path to a baseline file (ratchet mode: only gate on new or worsened pairs; the file must be committed to the repo)'
    required: false
    default: ''
  strict-palette:
    description: 'Fail outright when palette detection degrades (falls back to hard-coded colors only)'
    required: false
    default: 'false'
  upload-report:
    description: 'Upload report.json as an artifact'
    required: false
    default: 'true'
  sarif:
    description: 'Upload SARIF to GitHub code scanning (requires security-events: write, plus GitHub Advanced Security or a public repo)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install XamlContrast
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          dotnet tool install --global Cornhsu.XamlContrast --version "${{ inputs.version }}"
        else
          dotnet tool install --global Cornhsu.XamlContrast
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    # 先跑、先產報告與註記，最後一步才依結論擋（讓失敗的 PR 也看得到完整輸出）
    - name: Run audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        args=("${{ inputs.root }}" --json "$RUNNER_TEMP/xamlcontrast-report.json")
        [ "${{ inputs.sarif }}" = "true" ] && args+=(--sarif "$RUNNER_TEMP/xamlcontrast.sarif")
        [ "${{ inputs.fail-on }}" = "warn" ] && args+=(--fail-on warn)
        [ "${{ inputs.strict-palette }}" = "true" ] && args+=(--strict-palette)
        [ -n "${{ inputs.baseline }}" ] && args+=(--baseline "${{ inputs.baseline }}")
        xamlcontrast "${args[@]}"
        echo "exit=$?" >> "$GITHUB_OUTPUT"

    # 破的配對直接標在 PR 的行上（::error 註記吃 workspace 相對路徑；
    # findings 的 file 是「root 相對、正斜線」路徑，前綴 working-directory + root 即為
    # workspace 路徑。前綴組完要把 "./" 與重複的 "/" 收乾淨，否則 GitHub 對不上檔案。）
    - name: Annotate failing pairs
      if: ${{ always() }}
      shell: bash
      run: |
        report="$RUNNER_TEMP/xamlcontrast-report.json"
        [ -f "$report" ] || exit 0
        prefix=$(echo "${{ inputs.working-directory }}/${{ inputs.root }}" | sed 's|^\./||; s|//*|/|g; s|/$||')
        jq -r --arg root "$prefix" '
          .findings[]
          | select(.category == "fail" or .category == "warn")
          | "::\(if .category == "fail" then "error" else "warning" end) file=\($root)/\(.file),line=\(.line)::contrast \(.ratioDark):1 dark / \(.ratioLight):1 light (need \(.threshold)) — fg=\(.fg) bg=\(.bg) [\(.symmetry)]"
        ' "$report" || true

    # SARIF 的路徑是 root 相對 —— 先補上前綴變成 repo 相對，code scanning 才對得上檔案
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true   # 無 Advanced Security 的私有 repo 會 403，不該紅掉整個 job
      shell: bash
      run: |
        f="$RUNNER_TEMP/xamlcontrast.sarif"
        [ -f "$f" ] || exit 0
        prefix=$(echo "${{ inputs.working-directory }}/${{ inputs.root }}" | sed 's|^\./||; s|//*|/|g; s|/$||')
        jq --arg root "$prefix" \
          '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ($root + "/" + .)' \
          "$f" > "$RUNNER_TEMP/xamlcontrast.repo.sarif"
        mv "$RUNNER_TEMP/xamlcontrast.repo.sarif" "$f"
    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/xamlcontrast.sarif

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: xamlcontrast-report
        path: ${{ runner.temp }}/xamlcontrast-report.json
        if-no-files-found: ignore

    # 報告與註記都出去了，現在才依 gate 結論決定 job 成敗
    - name: Enforce gate
      shell: bash
      run: exit ${{ steps.audit.outputs.exit }}
