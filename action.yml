name: 'XamlContrast WCAG audit'
description: 'Static WCAG contrast audit for XAML source: scans the whole project, fails the PR when text falls below AA, annotates failing lines.'
author: 'Cornhsu'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  root:
    description: 'Root directory of the project to scan (the one containing your XAML)'
    required: true
  working-directory:
    description: 'Directory to run in (`root` is resolved relative to it)'
    required: false
    default: '.'
  version:
    description: 'Cornhsu.XamlContrast tool version (omit for the latest 1.x, the major version this action follows; pin an exact version such as 1.0.0 for fully reproducible runs)'
    required: false
    default: ''
  fail-on:
    description: 'warn: fail the job on any pair below AA; fail: only on pairs below the fail line. Omit to use the config file''s failOn, else warn'
    required: false
    default: ''
  min-coverage:
    description: 'Fail the job (exit 3) when fewer than this percentage (0-100) of colour pairs could be resolved. Omit to use the config file''s minCoverage, else 50; 0 disables'
    required: false
    default: ''
  baseline:
    description: 'Path to a baseline file (ratchet mode: only gate on new or worsened pairs; the file must be committed to the repo)'
    required: false
    default: ''
  strict-palette:
    description: 'true: fail the job (exit 3) when palette detection degrades (falls back to hard-coded colors only)'
    required: false
    default: 'false'
  comment:
    description: 'Post/update the audit report as a PR comment. Requires `permissions: pull-requests: write` on the job — without it the step 403s (it is continue-on-error, so the gate still works but the comment is silently lost).'
    required: false
    default: 'true'
  upload-report:
    description: 'Upload the JSON and Markdown reports as the xamlcontrast-report artifact'
    required: false
    default: 'true'
  sarif:
    description: 'Upload SARIF to GitHub code scanning (requires security-events: write, plus GitHub Advanced Security or a public repo)'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the uploaded report artifact. It also keys the PR comment: each name keeps its own comment. Give every call its own name when the action runs more than once in a workflow run (a matrix, or two calls in one job). Letters, digits, ".", "_" and "-" only, 1-100 characters, not starting with "-" and not only dots'
    required: false
    default: 'xamlcontrast-report'

runs:
  using: 'composite'
  steps:
    # inputs 一律先進 env 再用 shell 變數引用，不直接 ${{ }} 內插進 run:。內插是 shell 看到指令之前的字串替換，
    # 呼叫端只要把 input 接到不可信的來源（例如 `root: ${{ github.event.issue.title }}`），那段內容就會變成 runner 上的指令。
    #
    # 先驗再用（1.0）：0.x 的 `fail-on: Warn`、`strict-palette: True`、`sarif: yes` 都靜默變成預設值。
    # 未知值 → exit 2（與 CLI 的用法錯誤同一碼），在裝任何東西之前。訊息只點名 input，不印值。
    - name: Validate inputs
      shell: bash
      env:
        XC_ROOT: ${{ inputs.root }}
        XC_WORKDIR: ${{ inputs.working-directory }}
        XC_VERSION: ${{ inputs.version }}
        XC_FAIL_ON: ${{ inputs.fail-on }}
        XC_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XC_BASELINE: ${{ inputs.baseline }}
        XC_STRICT_PALETTE: ${{ inputs.strict-palette }}
        XC_COMMENT: ${{ inputs.comment }}
        XC_UPLOAD_REPORT: ${{ inputs.upload-report }}
        XC_SARIF: ${{ inputs.sarif }}
        XC_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        # 同一個 job 前一次呼叫留下的報告（$RUNNER_TEMP 共用）不能被這一次的註記與上傳撿去
        rm -f -- "$RUNNER_TEMP/xamlcontrast-report.json" "$RUNNER_TEMP/xamlcontrast-report.md" "$RUNNER_TEMP/xamlcontrast.sarif"
        bad=0
        refuse() { echo "::error title=XamlContrast action::$1"; bad=1; }
        # 帶換行的值一律拒絕：CLI／dotnet 的錯誤訊息會把它原樣印出，換行後的內容落在行首就成了
        # runner 會解析的 workflow command（::error …、::add-mask::）。這些值本來就跑不起來，提早擋不改變行為
        case "$XC_ROOT$XC_WORKDIR$XC_VERSION$XC_BASELINE$XC_MIN_COVERAGE" in
          *$'\n'* | *$'\r'*) refuse "root, working-directory, version, baseline and min-coverage must not contain a line break" ;;
        esac
        # 以 - 開頭的路徑會被 CLI 當成旗標：root: --version 印版本、exit 0，什麼都沒稽核就綠燈（審查 1.0 A3）。
        # Run audit 另外以 -- 傳 root（雙重保險），這裡先點名擋下
        case "$XC_ROOT" in -*) refuse "root must not start with '-' (write ./-name for such a directory)" ;; esac
        case "$XC_BASELINE" in -*) refuse "baseline must not start with '-' (write ./-name for such a file)" ;; esac
        case "$XC_FAIL_ON" in
          '' | warn | fail) ;;
          *) refuse "fail-on must be 'warn', 'fail' or empty (the config file's failOn, else warn)" ;;
        esac
        # 範圍（0-100）交給 CLI 驗：超出範圍是 exit 2 並說明
        [[ "$XC_MIN_COVERAGE" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || refuse "min-coverage must be a number between 0 and 100, or empty"
        # artifact-name 會成為 artifact 名稱與 PR 留言標記的一部分（標記又拼進 jq 字串），只收安全的字元（比照 Parity）。
        # bash 的 =~ 是整串比對，換行過不了
        if ! [[ "$XC_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || [[ "$XC_ARTIFACT_NAME" =~ ^-|^\.+$ ]]; then
          refuse "artifact-name must be 1-100 characters of A-Z, a-z, 0-9, '.', '_' or '-', not starting with '-' and not only dots"
        fi
        for pair in "strict-palette=$XC_STRICT_PALETTE" "comment=$XC_COMMENT" "upload-report=$XC_UPLOAD_REPORT" "sarif=$XC_SARIF"; do
          case "${pair#*=}" in
            true | false) ;;
            *) refuse "${pair%%=*} must be 'true' or 'false'" ;;
          esac
        done
        if [ "$bad" -ne 0 ]; then exit 2; fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install XamlContrast
      shell: bash
      env:
        XC_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$XC_VERSION" ]; then
          dotnet tool install --global Cornhsu.XamlContrast --version "$XC_VERSION"
        else
          # @v1 只跟隨 1.x（介面凍結的承諾）：不帶範圍會裝到 NuGet 上最新的穩定版，2.0.0 一發佈就跨 major。
          # "[1.*,2.0.0)" 取最高的 1.x 穩定版、而且上界擋住 2.0.0 —— 光寫 "1.*"，NuGet 上還沒有穩定的 1.x 時會裝到 2.0.0
          # （審查 1.0 B5 實測；有了上界就改成找不到版本而失敗）。發 2.0.0 時改成 "[2.*,3.0.0)"（ActionContractTests 會提醒）
          dotnet tool install --global Cornhsu.XamlContrast --version "[1.*,2.0.0)"
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    # 先跑、先產報告與註記，最後一步才依結論擋（讓失敗的 PR 也看得到完整輸出）
    - name: Run audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XC_ROOT: ${{ inputs.root }}
        XC_FAIL_ON: ${{ inputs.fail-on }}
        XC_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XC_BASELINE: ${{ inputs.baseline }}
        XC_STRICT_PALETTE: ${{ inputs.strict-palette }}
        XC_SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        args=(--json "$RUNNER_TEMP/xamlcontrast-report.json")
        args+=(--md "$RUNNER_TEMP/xamlcontrast-report.md")
        [ "$XC_SARIF" = "true" ] && args+=(--sarif "$RUNNER_TEMP/xamlcontrast.sarif")
        # gate 與覆蓋率下限：空白就不傳，交給 config（沒有就是內建預設）—— 旗標 > config > 預設
        [ -n "$XC_FAIL_ON" ] && args+=(--fail-on "$XC_FAIL_ON")
        [ -n "$XC_MIN_COVERAGE" ] && args+=(--min-coverage "$XC_MIN_COVERAGE")
        [ "$XC_STRICT_PALETTE" = "true" ] && args+=(--strict-palette)
        [ -n "$XC_BASELINE" ] && args+=(--baseline "$XC_BASELINE")
        # root 放在 -- 後面：之後的字一律是位置參數，以 - 開頭也不會被當成旗標
        args+=(-- "$XC_ROOT")
        # CLI 的輸出包在一次性 token 的 ::stop-commands:: 裡：被稽核的 XAML 是不可信的輸入，CLI 已經把控制字元跳脫，
        # 這是第二道防線 —— 這段期間 runner 不解析任何 workflow command。token 每次隨機（固定的 token 可以被輸出內容提前關掉）
        token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        echo "::stop-commands::$token"
        xamlcontrast "${args[@]}"
        code=$?
        echo "::$token::"
        echo "exit=$code" >> "$GITHUB_OUTPUT"

    # 把稽核報告貼成 PR 留言（同一則反覆更新，不洗版）。
    # 行內註記只標在出問題的那一行，PR 上沒有總覽 —— reviewer 看不到「總共破幾組、
    # 色盤有沒有偵測失敗、有幾組被豁免或壓掉」。退化計數必須出現在人會看的那份報告裡。
    # continue-on-error：fork PR 的 GITHUB_TOKEN 唯讀，貼留言會 403 —— 那是預期的，
    # 不該讓整個 job 紅在這步（gate 仍在最後一步照常擋）。
    - name: Comment report on PR
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        XC_PR: ${{ github.event.pull_request.number }}
        XC_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        report="$RUNNER_TEMP/xamlcontrast-report.md"
        out="$RUNNER_TEMP/xamlcontrast-comment.md"
        [ -f "$report" ] || { echo "no report to post"; exit 0; }
        # 標記以 artifact-name 區分：每個名稱各自一則留言。預設名稱的標記與 1.0 之前相同，既有的留言照樣被更新。
        # 名稱已在 Validate inputs 限定成 [A-Za-z0-9._-]，拼進 jq 字串是安全的
        marker="<!-- $XC_ARTIFACT_NAME -->"
        # GitHub 留言上限 ~65536 字，超過就截斷並附提示（完整內容在 artifact）
        if [ "$(wc -c < "$report")" -gt 60000 ]; then
          { echo "$marker"; head -c 60000 "$report"; printf '\n\n<sub>⚠️ Report truncated because it exceeds the comment size limit — see the %s artifact on this workflow run for the full version.</sub>\n' "$XC_ARTIFACT_NAME"; } > "$out"
        else
          { echo "$marker"; cat "$report"; } > "$out"
        fi
        pr="$XC_PR"
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
          --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$out" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@"$out" >/dev/null
        fi

    # 低於 AA 的配對直接標在 PR 的行上。等級：gate 擋的是 error（預設 gate warn 時 warn 也擋）、
    # gate 不擋的 warn（--fail-on fail）是 warning、--baseline 的既有債是 notice（不擋，只提醒）。
    # （::error 註記吃 workspace 相對路徑；
    # findings 的 file 是「root 相對、正斜線」路徑，前綴 working-directory + root 即為
    # workspace 路徑。前綴組完要把 "./"、"/./"、重複的 "/" 收乾淨，否則 GitHub 對不上檔案 ——
    # root 是 "."（XAML 在 repo 頂層）時前綴是空的，不能接出 "./Views/…" 或 "/Views/…"；
    # sed 先在頭尾補 "/" 讓每個 "." 段都夾在兩個 "/" 之間，再逐段剔除。）
    - name: Annotate failing pairs
      if: ${{ always() }}
      shell: bash
      env:
        XC_ROOT: ${{ inputs.root }}
        XC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        report="$RUNNER_TEMP/xamlcontrast-report.json"
        [ -f "$report" ] || exit 0
        prefix=$(echo "$XC_WORKDIR/$XC_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        # workflow command 的跳脫（GitHub 規格）：訊息跳脫 % \r \n，屬性值（file=…）另外跳脫 : 與 ,。
        # 不跳脫的話，檔名裡一個逗號就把 file 屬性切斷、一個換行就讓後面的內容落在行首變成另一個 workflow command
        jq -r --arg root "$prefix" '
          def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
          .summary.failOn as $gate
          | .findings[]
          | select(.category == "fail" or .category == "warn")
          | (if .baseline == "known" then "notice" elif .category == "fail" or $gate == "warn" then "error" else "warning" end) as $level
          | (if .ratioLight == null then "\(.ratioDark):1 (dark theme only)" elif .ratioDark == null then "\(.ratioLight):1 (light theme only)" else "\(.ratioDark):1 dark / \(.ratioLight):1 light" end) as $ratio
          | "::\($level) file=\(($root + .file) | prop),line=\(.line)::\("contrast \($ratio) (need \(.threshold)) — fg=\(.fg) bg=\(.bg) [\(.symmetry)]\(if .baseline == "known" then " — known debt in the baseline" else "" end)" | esc)"
        ' "$report" || true

    # SARIF 的路徑是 root 相對 —— 先補上前綴變成 repo 相對，code scanning 才對得上檔案
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true   # 無 Advanced Security 的私有 repo 會 403，不該紅掉整個 job
      shell: bash
      env:
        XC_ROOT: ${{ inputs.root }}
        XC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        f="$RUNNER_TEMP/xamlcontrast.sarif"
        [ -f "$f" ] || exit 0
        prefix=$(echo "$XC_WORKDIR/$XC_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        jq --arg root "$prefix" \
          '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ($root + .)' \
          "$f" > "$RUNNER_TEMP/xamlcontrast.repo.sarif"
        mv "$RUNNER_TEMP/xamlcontrast.repo.sarif" "$f"
    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/xamlcontrast.sarif
        # 同一個 run 用兩次時 code scanning 以 category 區分兩份分析（不給的話後一份蓋掉前一份）；預設名稱照舊不給
        category: ${{ inputs.artifact-name != 'xamlcontrast-report' && inputs.artifact-name || '' }}

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/xamlcontrast-report.json
          ${{ runner.temp }}/xamlcontrast-report.md
        if-no-files-found: ignore

    # 報告與註記都出去了，現在才依 gate 結論決定 job 成敗
    - name: Enforce gate
      shell: bash
      env:
        XC_EXIT: ${{ steps.audit.outputs.exit }}
      run: exit "$XC_EXIT"
