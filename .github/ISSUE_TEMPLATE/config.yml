# 檔名的數字前綴是排序用的。GitHub 沒有指定表單順序的欄位,它照檔名字母排 ——
# 原本 bug.yml 排第一,等於把最籠統、最沒價值的那張放在最顯眼的位置,而遇到假警報
# 的人很可能因此點進 Bug,交出一份沒有 XAML、沒有色盤行的回報,要來回問三輪。
# 現在的順序是價值由高到低,也剛好是「工具判斷錯了」到「工具壞了」。
# 新增表單時記得加前綴,否則它會排到最前面。
#
# 空白 issue 保持開啟:上面四張表單不可能涵蓋所有情況,而「沒有適合的表單」
# 是人放棄開 issue 最常見的理由 —— 這個專案現在最缺的就是外部回報,
# 不該為了收件格式整齊而把人擋在門外。
blank_issues_enabled: true
contact_links:
  - name: Known limitations — check here first
    url: https://github.com/HSU-YU-MING/cornhsu-xamlcontrast#known-limitations
    about: Some gaps are deliberate and documented. Reports about them are still welcome — it just saves us the diagnosis.
  - name: How to write a report I can reproduce
    url: https://github.com/HSU-YU-MING/cornhsu-xamlcontrast/blob/main/CONTRIBUTING.md
    about: What to include, what gets merged, and why real-world evidence matters more than pull requests here.
