name: release

on:
  push:
    # 只認三段式版號 tag（v1.2.3）。刻意不用 'v*'：1.0 起維護移動式 major tag（v1，每個 1.x 發版後前移，
    # 見 RELEASING.md），它也符合 'v*'，每次前移都會誤觸發一次注定失敗的 release
    # （Parity 2026-08-26 發 1.0.0 與 1.1.0 時各踩一次）
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

# 研究資料的保護：release 用真的版號（-p:Version=<tag>）建置，再跑測試與 demo 守門 —— 那是一個「正式版」在跑稽核，
# 沒有這一行就會往 stats.cornhsu.com 送出真的匿名統計（1.1 起預設會送），每發一次版就混進幾筆維護者自己的資料
env:
  DO_NOT_TRACK: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 建 GitHub Release
      id-token: write   # Trusted Publishing：GitHub 簽發 OIDC token 與 NuGet 交換臨時金鑰
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # SourceLink 需要完整 git 歷史

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # CHANGELOG 是「推 tag 之前」的版本真相源（Release 的說明也取自它）。兩者不一致就別發：
      # 擋在這裡的代價是「tag 已推、但沒發出去」—— 刪 tag 重來即可；
      # 相對地，CHANGELOG 沒寫就發到 nuget.org 是沒有反悔機會的（照 Parity）
      - name: Assert CHANGELOG top entry matches the tag
        env:
          XC_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          top=$(grep -m1 -oE '^## +\[?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ "$top" != "$XC_VERSION" ]; then
            echo "✗ tag 是 v$XC_VERSION，但 CHANGELOG.md 最上面那個版本是 ${top:-（沒有）}。先補上 ## $XC_VERSION 的段落再重推 tag。"
            exit 1
          fi
          echo "✓ CHANGELOG 頂端 $top 與 tag 一致"

      - run: dotnet restore XamlContrast.slnx
      - run: dotnet build XamlContrast.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test XamlContrast.slnx -c Release --no-build

      # 發佈前的最後一道守門：示範專案必須如預期 exit 1（3 組 fail）。
      # 1.0 的退出碼變動（預設 gate warn、「結果不可信」改 exit 3）不影響 demo：它沒有 warn、覆蓋率 100%，
      # 照樣是「找到違規」的 1。跑出 3 = 工具沒看到 demo（偵測或解析壞了），一樣中止
      - name: Audit demo (預期 fail, exit 1)
        run: |
          set +e
          dotnet run --project src/XamlContrast.Cli -c Release --no-build -- samples/demo
          [ "$?" -eq 1 ] || { echo "✗ demo 未如預期 exit 1，中止發佈"; exit 1; }

      - run: dotnet pack XamlContrast.slnx -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts

      # Trusted Publishing：用 GitHub OIDC 向 nuget.org 換一把只活 1 小時的臨時金鑰，
      # 不需保管長效 API key、也不需 repo secret（需先在 nuget.org 設定 trusted publisher policy）
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0(v1 當時所指的 commit)
        id: login
        with:
          user: Cornhsu   # nuget.org 使用者名稱（不是 email）

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          -k ${{ steps.login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate

      # 建 GitHub Release。Marketplace 的版本呈現綁 Release,而使用者被要求 pin @vX.Y.Z 時,
      # Releases 頁是他們唯一看得到「這版改了什麼」的地方 —— 先前四個 repo 幾乎都是空的。
      # 內容直接取自 CHANGELOG 對應那一節,不另外手寫一份(單一事實來源)。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # CHANGELOG 兩種標題格式都吃:「## 0.12.0」與「## [1.1.0] — 2026-08-07」
          notes=$(awk -v v="$v" '
            /^## / {
              if (found) exit
              line = $0; sub(/^## +\[?/, "", line)
              if (index(line, v) == 1) {
                rest = substr(line, length(v) + 1)
                if (rest !~ /^[0-9.]/) { found = 1; next }
              }
              next
            }
            found { print }
          ' CHANGELOG.md)
          [ -n "$notes" ] || notes="See CHANGELOG.md."
          # 冪等:重跑 job 時改成更新既有 Release,而不是報錯
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --notes "$notes"
            echo "✔ 已更新既有 Release v$v"
          else
            gh release create "v$v" --title "v$v" --notes "$notes" --verify-tag
            echo "✔ 已建立 Release v$v"
          fi
