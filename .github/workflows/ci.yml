name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 排版守門（對齊 PolyMigrate 的 CI 形狀）。風格規則見 .editorconfig。
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format XamlContrast.slnx --verify-no-changes

  # 使用者是 WPF 開發者 —— 他們的機器與 CI 幾乎都在 Windows。
  # 「Linux 也跑得動」是賣點（下面的 build-test 證明），但不能因此漏掉主力平台。
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test XamlContrast.slnx -c Release

  # 打包 + 真的把工具裝起來跑一次:`dotnet pack` 綠不等於 `dotnet tool install` 之後跑得動。
  pack-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/XamlContrast.Cli/XamlContrast.Cli.csproj -c Release -p:Version=0.0.0-ci -o nupkg
      - name: Install the packed tool and run it
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source ./nupkg --version 0.0.0-ci Cornhsu.XamlContrast
          export PATH="$HOME/.dotnet/tools:$PATH"
          xamlcontrast --help > /dev/null
          echo "✓ 打包出來的工具在 ${{ matrix.os }} 上裝得起來也跑得動"
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: nupkg/*.nupkg

  build-test:
    name: Build + Test + demo 自我把關
    runs-on: ubuntu-latest   # 解析不依賴 WPF runtime —— Linux 可跑是賣點，CI 就用它證明
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XamlContrast.slnx -c Release

      - name: Unit tests
        run: dotnet test XamlContrast.slnx -c Release --no-build

      # 離線示範刻意做壞 → 預期 exit 1。這正是 CI 把關該有的行為，
      # 所以「跑出 exit 1」= 成功；跑出別的才是回歸（含 0 —— 守門員靜默放行）。
      - name: Audit demo (預期 fail, exit 1)
        run: |
          set +e
          dotnet run --project src/XamlContrast.Cli -c Release --no-build -- \
            samples/demo --json "$RUNNER_TEMP/demo-report.json"
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "✓ 示範專案如預期 exit 1 —— 守門員行為正確"
          else
            echo "✗ 預期 exit 1，實際為 $code"
            exit 1
          fi
          # 再驗 JSON 的關鍵計數：3 fail、1 豁免、1 壓掉（骨架自我把關，不只看退出碼）
          jq -e '.summary.counts.fail == 3 and .summary.disabledExempt == 1 and .summary.suppressed == 1' \
            "$RUNNER_TEMP/demo-report.json" > /dev/null \
            || { echo "✗ demo 報告計數與預期不符"; jq .summary "$RUNNER_TEMP/demo-report.json"; exit 1; }
          echo "✓ demo 報告計數正確"

      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-report
          path: ${{ runner.temp }}/demo-report.json
          if-no-files-found: ignore
