name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + Test + demo 自我把關
    runs-on: ubuntu-latest   # 解析不依賴 WPF runtime —— Linux 可跑是賣點，CI 就用它證明
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XamlContrast.slnx -c Release

      - name: Unit tests
        run: dotnet test XamlContrast.slnx -c Release --no-build

      # 離線示範刻意做壞 → 預期 exit 1。這正是 CI 把關該有的行為，
      # 所以「跑出 exit 1」= 成功；跑出別的才是回歸（含 0 —— 守門員靜默放行）。
      - name: Audit demo (預期 fail, exit 1)
        run: |
          set +e
          dotnet run --project src/XamlContrast.Cli -c Release --no-build -- \
            samples/demo --json "$RUNNER_TEMP/demo-report.json"
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "✓ 示範專案如預期 exit 1 —— 守門員行為正確"
          else
            echo "✗ 預期 exit 1，實際為 $code"
            exit 1
          fi
          # 再驗 JSON 的關鍵計數：3 fail、1 豁免、1 壓掉（骨架自我把關，不只看退出碼）
          jq -e '.summary.counts.fail == 3 and .summary.disabledExempt == 1 and .summary.suppressed == 1' \
            "$RUNNER_TEMP/demo-report.json" > /dev/null \
            || { echo "✗ demo 報告計數與預期不符"; jq .summary "$RUNNER_TEMP/demo-report.json"; exit 1; }
          echo "✓ demo 報告計數正確"

      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-report
          path: ${{ runner.temp }}/demo-report.json
          if-no-files-found: ignore
